services:
  mongo:
    image: mongo:6
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: .
    depends_on:
      - mongo
    environment:
      SERVER_PORT: 8000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: codigo-a-voluntad
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo-para-compose}
    ports:
      - "8000:8000"

volumes:
  mongo-data:
