name: Frontend deployment

concurrency:
  group: frontend-deployment
  cancel-in-progress: false

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check deployment token
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Falta el secret AZURE_STATIC_WEB_APPS_API_TOKEN del repositorio (token de despliegue de la Static Web App)."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find backend URL
        run: |
          app_domain="$(az containerapp show \
            --name ca-ddso-backend \
            --resource-group rg-ddso-backend \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          echo "REACT_APP_API_URL=https://${app_domain}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --workspace=frontend --include=dev

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: packages/frontend/build
          skip_app_build: true
          skip_api_build: true
